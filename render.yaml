services:
  - type: web
    name: shopify-component-toolkit
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    # IMPORTANT: the Render dashboard Start Command overrides this file. Keep
    # both in sync. -c must point at backend/gunicorn.conf.py after --chdir, and
    # CLI flags make gthread/threads visible even if the conf file is missed.
    startCommand: gunicorn app:app --chdir backend -c gunicorn.conf.py --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 8 --timeout 300
    autoDeploy: true
    envVars:
      - key: PYTHONUTF8
        value: "1"
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2025-07"
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: OFFICE_API_URL
        sync: false
      - key: OFFICE_API_KEY
        sync: false
      - key: KLAVIYO_API_KEY
        sync: false
      - key: KLAVIYO_METRIC_NAME
        value: "Bite Production Update"
      - key: KLAVIYO_CUSTOMER_TYPE_METRIC_NAME
        value: "Bite Customer Type Assigned"
      - key: KLAVIYO_CUSTOMER_REGISTERED_METRIC_NAME
        value: "Bite Customer Registered"
      - key: KLAVIYO_PROOF_APPROVED_METRIC_NAME
        value: "Bite Proof Approved"
      - key: KLAVIYO_API_REVISION
        value: "2025-01-15"
      - key: PORTAL_PAGE_URL
        value: "https://bitepromotions.uk/pages/portal"
      - key: CUSTOMER_LOGIN_RETURN_TO
        value: "/pages/portal"
      - key: ROYAL_MAIL_API_KEY
        sync: false
      - key: ROYAL_MAIL_API_URL
        sync: false
      - key: FEDEX_API_KEY
        sync: false
      - key: FEDEX_API_URL
        sync: false
      - key: FEDEX_ACCOUNT_NUMBER
        sync: false
      - key: FEDEX_CLIENT_ID
        sync: false
      - key: FEDEX_CLIENT_SECRET
        sync: false
      # Optional FedEx label tuning (defaults: STOCK_4X6, TOP_EDGE_OF_TEXT_FIRST)
      - key: FEDEX_LABEL_STOCK_TYPE
        sync: false
      - key: FEDEX_LABEL_PRINTING_ORIENTATION
        sync: false
      - key: FEDEX_LABEL_ROTATION
        sync: false
      # Print layout tuning (applied on every print/reprint; restart after changing)
      - key: FEDEX_LABEL_SHIFT_MM
        sync: false
      - key: FEDEX_LABEL_SCALE
        sync: false
      # Print-time 180° flip (^POI). Use this OR FEDEX_LABEL_ROTATION below — not both.
      - key: FEDEX_LABEL_PRINT_ROTATE_180
        sync: false
      - key: PALLETWAYS_API_KEY
        sync: false
      - key: SHIP_FROM_NAME
        sync: false
      - key: SHIP_FROM_PHONE
        sync: false
      - key: SHIP_FROM_LINE1
        sync: false
      - key: SHIP_FROM_LINE2
        sync: false
      - key: SHIP_FROM_CITY
        sync: false
      - key: SHIP_FROM_STATE
        sync: false
      - key: SHIP_FROM_POSTCODE
        sync: false
      - key: SHIP_FROM_COUNTRY
        value: "GB"
      - key: OFFICE_PRINT_SERVER_URL
        sync: false
      - key: OFFICE_PRINT_SERVER_KEY
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false

  # Nightly Phase 7 visibility backstop — 03:00 UTC (04:00 BST in summer).
  # HTTP-POSTs the web service so webhook/reconcile share one code path.
  # Tony sets CRON_SECRET (same value on web + cron) and RECONCILE_VISIBILITY_URL
  # to https://<web-service>/api/cron/reconcile-visibility
  - type: cron
    name: reconcile-visibility-nightly
    runtime: native
    plan: free
    region: oregon
    schedule: "0 3 * * *"
    buildCommand: "true"
    startCommand: 'curl -fsS -X POST "$RECONCILE_VISIBILITY_URL" -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d "{}"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: RECONCILE_VISIBILITY_URL
        sync: false

