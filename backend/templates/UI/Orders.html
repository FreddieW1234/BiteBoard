        .order-cancel-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .order-cancelled-note { font-size: 0.82rem; font-weight: 600; color: #b91c1c; }
        .order-cancelled-pill { margin-left: 6px; font-size: 0.68rem; font-weight: 600; color: #991b1b; background: #fee2e2; border-radius: 999px; padding: 1px 7px; vertical-align: middle; }
        .order-cancel-panel { max-width: 460px; display: flex; flex-direction: column; gap: 10px; }
        .order-cancel-panel h3 { margin-bottom: 0; }
        .order-cancel-lead { font-size: 0.85rem; color: #b91c1c; margin: 0; }
        .order-cancel-field { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; font-weight: 600; color: #374151; }
        .order-cancel-field select, .order-cancel-field input { font: inherit; font-weight: 400; font-size: 0.875rem; padding: 7px 9px; border: 1px solid #d1d5db; border-radius: 8px; }
        .order-cancel-check { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #374151; }
        .order-cancel-msg { font-size: 0.82rem; color: #b91c1c; }
        .order-cancel-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
        .order-cancel-confirm { border: 1px solid #b91c1c; background: #b91c1c; color: #fff; border-radius: 8px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
        .order-cancel-confirm:hover { background: #991b1b; }
        .order-cancel-confirm:disabled { opacity: 0.6; cursor: default; }
        html[data-theme="dark"] .order-cancel-panel { background: #161b22; }
        html[data-theme="dark"] .order-cancel-panel h3, html[data-theme="dark"] .order-cancel-check, html[data-theme="dark"] .order-cancel-field { color: #e6edf3; }
        html[data-theme="dark"] .order-cancel-field select, html[data-theme="dark"] .order-cancel-field input { background: #0d1117; border-color: #30363d; color: #e6edf3; }
        html[data-theme="dark"] .order-cancelled-pill { background: rgba(239, 68, 68, 0.18); color: #fecaca; }

        /* Change history button + timeline */
        .btn-order-history {
            display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid #d1d5db; background: #fff; color: #374151;
            border-radius: 8px; padding: 5px 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
            margin-left: auto; white-space: nowrap;  /* right-hand end of the email / customer row */
        }
        .btn-order-history:hover { border-color: #a5b4fc; color: #4f46e5; }
        .order-history-panel { max-width: 560px; max-height: 80vh; display: flex; flex-direction: column; }
        .order-history-body { overflow-y: auto; margin-right: -8px; padding-right: 8px; }
        .order-history-list { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid #e5e7eb; }
        .order-history-event { position: relative; padding: 0 0 14px 12px; }
        .order-history-event::before {
            content: ''; position: absolute; left: -21px; top: 4px;
            width: 10px; height: 10px; border-radius: 50%; background: #6366f1; border: 2px solid #fff;
        }
        .order-history-meta { font-size: 0.72rem; color: #6b7280; }
        .order-history-action { font-size: 0.88rem; font-weight: 600; color: #111827; margin-top: 2px; }
        .order-history-item { font-weight: 500; color: #4b5563; }
        .order-history-item::before { content: '· '; }
        .order-history-detail { font-size: 0.8rem; color: #374151; white-space: pre-wrap; margin-top: 2px; word-break: break-word; }
        .order-history-empty { font-size: 0.85rem; color: #6b7280; margin: 0 0 12px; }
        html[data-theme="dark"] .btn-order-history { background: #161b22; border-color: #30363d; color: #c9d1d9; }
        html[data-theme="dark"] .order-history-panel { background: #161b22; }
        html[data-theme="dark"] .order-history-panel h3,
        html[data-theme="dark"] .order-history-action { color: #e6edf3; }
        html[data-theme="dark"] .order-history-detail,
        html[data-theme="dark"] .order-history-item { color: #c9d1d9; }
        html[data-theme="dark"] .order-history-list { border-left-color: #30363d; }
        html[data-theme="dark"] .order-history-event::before { border-color: #161b22; }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand"><a href="/"><i class="fas fa-store"></i><span class="brand-text">BiteBoard</span></a></div>
            <nav class="sidebar-nav">
                <div class="app-tabs">
                    <a href="/" class="app-tab"><i class="fas fa-gauge-high"></i><span>Dashboard</span></a>
                    <a href="/app/Products" class="app-tab"><i class="fas fa-box-open"></i><span>Products</span></a>
                    <a href="/app/Orders" class="app-tab active"><i class="fas fa-box"></i><span>Orders</span></a>
                                        <a href="/app/Diary" class="app-tab"><i class="fas fa-calendar-days"></i><span>Diary</span></a>
<a href="/app/Customers" class="app-tab"><i class="fas fa-users"></i><span>Customers</span></a>
                                        <a href="/app/Menu" class="app-tab"><i class="fas fa-sitemap"></i><span>Menu</span></a>
                                        {% if staff_is_admin %}<a href="/app/Users" class="app-tab"><i class="fas fa-user-gear"></i><span>Users</span></a>{% endif %}
                    {% if staff_show_dev_tabs %}
                    <a href="/app/Artwork_Updater" class="app-tab dev-tab"><i class="fas fa-palette"></i><span>Artwork Updater</span></a>
                    <a href="/app/Files" class="app-tab dev-tab"><i class="fas fa-folder-open"></i><span>Files</span></a>
{% endif %}
                </div>
            </nav>
            <div class="sidebar-footer"></div>
        </aside>
        <script>(function(){if(window.location.pathname.indexOf('/app/')===0){var s=document.querySelector('.sidebar');if(s)s.classList.add('collapsed');}})();</script>

        <div class="main-wrap">
            <h1 class="page-title"><i class="fas fa-box"></i> Orders</h1>
            <div class="toolbar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search order, company, customer, email…">
                </div>
                <span class="count-pill" id="count-pill">Loading…</span>
                <div class="status-legend">
                    <span class="status-legend-title">Key</span>
                    <span class="status-legend-item"><span class="status-legend-dot orange"></span> Waiting on customer</span>
                    <span class="status-legend-item"><span class="status-legend-dot red"></span> Customer waiting on us</span>
                </div>
                <div class="toolbar-actions">
                    <select class="sort-select" id="sort-select" aria-label="Sort active orders">
                        <option value="priority">Sort: Priority</option>
                        <option value="recent">Sort: Most recent</option>
                    </select>
                    <button type="button" class="btn-ghost" id="refresh-btn"><i class="fas fa-rotate"></i> Refresh</button>
                </div>
            </div>
            <div id="content">
                <div class="list-card"><div class="state-msg"><i class="fas fa-spinner fa-spin"></i> Loading orders…</div></div>
            </div>
        </div>
    </div>

    <script>
        let allOrders = [];
        let orderIndicators = {};
        let sortMode = localStorage.getItem('orders-sort') || 'priority';
        const SORT_STORAGE_KEY = 'orders-sort';
        let ordersRefreshTimer = null;
        let suppressOrdersRefresh = false;

        function escapeHtml(s) {
            return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function formatDate(iso) {
            if (!iso) return '—';
            return iso.slice(0, 10);
        }

        function formatGbp(amount) {
            const val = parseFloat(String(amount ?? '').replace(/,/g, '')) || 0;
            return '£' + val.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatLinePrice(li) {
            if (li.price_display) return li.price_display;
            return `${formatGbp(li.unit_price)} × ${li.quantity} = ${formatGbp(li.total)}`;
        }

        function renderLineItem(li, orderId) {
            let html = `<div class="detail-line">
                <div class="line-header-row">
                    <div class="line-head-left">`;
            if (li.sku) html += `<div class="line-sku">${escapeHtml(li.sku)}</div>`;
            html += `<span class="line-title">${escapeHtml(li.title)}</span></div>
                    <div class="line-head-right">
                        <div class="line-head-actions">`;
            if (orderId && li.line_number != null) {
                html += `<label class="print-select-wrap">Print:
                    <select class="print-select" data-order-id="${escapeHtml(orderId)}" data-line-number="${escapeHtml(li.line_number)}">
                        <option value="" selected>Choose…</option>
                        <option value="production">Production note</option>
                        <option value="artwork">Artwork job sheet</option>
                        <option value="sage">Sage info (whole order)</option>
                    </select></label>`;
            }
            html += `</div>
                        <span class="line-price">${escapeHtml(formatLinePrice(li))}</span>
                    </div>
                </div>`;
            if (li.meta_line || (li.properties && li.properties.length)) {
                html += `<div class="line-main"><div class="line-details">`;
                if (li.meta_line) html += `<div class="line-meta">${escapeHtml(li.meta_line)}</div>`;
                if (li.properties && li.properties.length) {
                    html += '<ul class="line-props">';
                    li.properties.forEach(p => {
                        html += `<li><strong>${escapeHtml(p.key)}:</strong> ${escapeHtml(p.value)}</li>`;
                    });
                    html += '</ul>';
                }
                html += `</div></div>`;
            }
            if (li.line_number != null) {
                html += `<div class="office-tracking-host" data-line-number="${escapeHtml(li.line_number)}"><div class="office-tracking-loading"><i class="fas fa-spinner fa-spin"></i> Loading tracking…</div></div>`;
            }
            html += '</div>';
            return html;
        }

        function renderLineSection(title, items, emptyText, orderId) {
            let html = `<div class="detail-section"><h4>${escapeHtml(title)}</h4>`;
            if (items && items.length) {
                items.forEach(li => { html += renderLineItem(li, orderId); });
            } else {
                html += `<p class="detail-empty">${escapeHtml(emptyText)}</p>`;
            }
            html += '</div>';
            return html;
        }

        function renderFeeItem(li) {
            const price = li.total_display || formatGbp(li.total);
            let html = `<div class="detail-line detail-line-fee"><div class="line-fee-row">
                <span class="line-title">${escapeHtml(li.title)}</span>
                <span class="line-price">${escapeHtml(price)}</span>
            </div>`;
            if (li.properties && li.properties.length) {
                html += '<ul class="line-props">';
                li.properties.forEach(p => {
                    html += `<li><strong>${escapeHtml(p.key)}:</strong> ${escapeHtml(p.value)}</li>`;
                });
                html += '</ul>';
            }
            html += '</div>';
            return html;
        }

        function renderFeesSection(fees, orderId) {
            let html = '<div class="detail-section detail-section-fees"><h4>Fees</h4>';
            (fees || []).forEach(li => { html += renderFeeItem(li); });
            html += `<div class="add-charge" data-order-id="${escapeHtml(orderId)}">
                <button type="button" class="btn-add-charge"><i class="fas fa-plus"></i> Add charge</button>
                <form class="add-charge-form" hidden>
                    <input type="text" name="title" maxlength="120" placeholder="Description, e.g. Extra artwork time" required>
                    <input type="number" name="amount" min="0.01" step="0.01" placeholder="£ ex VAT" required>
                    <label><input type="checkbox" name="taxable" checked> Add VAT</label>
                    <label><input type="checkbox" name="notify_customer" checked> Email an order update</label>
                    <button type="submit" class="btn-add-charge-save">Add to order</button>
                    <button type="button" class="btn-add-charge-cancel">Cancel</button>
                    <span class="add-charge-msg" hidden></span>
                </form>
            </div>`;
            html += '</div>';
            return html;
        }

        async function submitAddCharge(form) {
            const wrap = form.closest('.add-charge');
            const orderId = wrap.dataset.orderId;
            const msg = form.querySelector('.add-charge-msg');
            const btn = form.querySelector('.btn-add-charge-save');
            const title = form.elements.title.value.trim();
            const amount = parseFloat(form.elements.amount.value);
            const taxable = form.elements.taxable.checked;
            const notifyCustomer = form.elements.notify_customer.checked;
            if (!title || !(amount > 0)) return;
            const order = allOrders.find(o => String(o.id) === String(orderId));
            const label = `${title} - ${formatGbp(amount)}${taxable ? ' + VAT' : ' (no VAT)'}`;
            const extra = notifyCustomer ? '\n\nThe customer will be emailed an order update.' : '\n\nThe customer will NOT be emailed.';
            if (!confirm(`Add this charge to ${order ? order.name : 'the order'} in Shopify?\n\n${label}${extra}`)) return;
            btn.disabled = true; btn.textContent = 'Adding...';
            msg.hidden = true;
            try {
                const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}/charge`, {
                    method: 'POST', credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, amount, taxable, notify_customer: notifyCustomer }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.success) throw new Error(data.error || ('Request failed: ' + res.status));
                let note = `Added. New order total ${formatGbp(data.total)}`;
                if (data.outstanding > 0) note += `, ${formatGbp(data.outstanding)} still to pay`;
                if (data.customer_notified) note += ' - order update emailed to the customer';
                if (data.notify_error) note += ` - order update email NOT sent: ${data.notify_error}`;
                note += '.';
                const existing = allOrders.find(o => String(o.id) === String(orderId));
                if (data.updated_order && existing) {
                    // Redraw this order with Shopify's new fees and totals (open orders stay open).
                    Object.assign(existing, data.updated_order);
                    renderOrdersView(filterOrders(document.getElementById('search-input').value));
                    const box = document.querySelector(`#details-${CSS.escape(String(orderId))} .add-charge`);
                    if (box) box.insertAdjacentHTML('beforeend', `<div class="add-charge-msg ok">${escapeHtml(note)}</div>`);
                    return;
                }
                // Fallback: show the new line; totals refresh on next load.
                wrap.insertAdjacentHTML('beforebegin', renderFeeItem({ title, fee_label: title, fee_name: title, total: amount, total_display: formatGbp(amount) }));
                msg.textContent = note;
                msg.className = 'add-charge-msg ok';
                msg.hidden = false;
                form.elements.title.value = '';
                form.elements.amount.value = '';
            } catch (err) {
                msg.textContent = 'Could not add the charge: ' + (err.message || err);
                msg.className = 'add-charge-msg err';
                msg.hidden = false;
            } finally {
                btn.disabled = false; btn.textContent = 'Add to order';
            }
        }

        function renderAddressBlock(label, address) {
            const text = (address && address.text) ? address.text : '';
            if (!text) {
                return `<div class="order-info-field"><label>${escapeHtml(label)}</label><div class="order-info-value order-address-value empty">—</div></div>`;
            }
            return `<div class="order-info-field"><label>${escapeHtml(label)}</label><div class="order-info-value order-address-value">${escapeHtml(text).replace(/\n/g, '<br>')}</div></div>`;
        }

        function renderCostLine(label, priceDisplay, rowClass = '') {
            const extra = rowClass ? ` ${rowClass}` : '';
            return `<div class="detail-line detail-line-cost${extra}">
                <div class="line-fee-row">
                    <span class="line-title">${escapeHtml(label)}</span>
                    <span class="line-price">${escapeHtml(priceDisplay)}</span>
                </div>
            </div>`;
        }

        function renderOrderGrandTotal(o) {
            const total = o.total_display || formatGbp(o.total);
            return `<div class="line-fee-row order-grand-total">
                <span class="line-title">Total</span>
                <span class="line-price">${escapeHtml(total)}</span>
            </div>`;
        }

        function renderOrderCostSections(o) {
            let html = '';
            const ship = o.shipping_display || formatGbp(o.shipping);
            const tax = o.tax_display || formatGbp(o.tax);
            const net = o.total_net_display || formatGbp(
                (parseFloat(String(o.total ?? '').replace(/,/g, '')) || 0)
                - (parseFloat(String(o.tax ?? '').replace(/,/g, '')) || 0)
            );
            const shipVal = parseFloat(String(o.shipping ?? '').replace(/,/g, '')) || 0;
            const taxVal = parseFloat(String(o.tax ?? '').replace(/,/g, '')) || 0;
            if (shipVal > 0) {
                html += `<div class="detail-section detail-section-extra-costs">${renderCostLine('Shipping', ship)}</div>`;
            }
            html += `<div class="order-summary-total">${renderCostLine('Total Net of VAT', net, 'order-net-total')}`;
            if (taxVal > 0) html += renderCostLine('VAT', tax);
            html += renderOrderGrandTotal(o);
            html += '</div>';
            return html;
        }

        function renderOrderAddressesSection(o) {
            const shipping = o.shipping_address;
            const billing = o.billing_address;
            const payment = o.payment || {};
            const paymentLabel = payment.label || '—';
            const paymentDetail = payment.detail || '';
            if (!shipping && !billing && paymentLabel === '—') return '';
            let html = `<div class="detail-section order-addresses-section"><h4>Addresses &amp; payment</h4>
                <div class="order-info-panel"><div class="order-addresses-grid">`;
            html += renderAddressBlock('Shipping address', shipping);
            html += renderAddressBlock('Billing address', billing);
            html += `<div class="order-info-field"><label>Payment method</label>
                <div class="order-info-value payment-value${paymentLabel === '—' ? ' empty' : ''}">${escapeHtml(paymentLabel)}${paymentDetail ? `<div class="line-meta">${escapeHtml(paymentDetail)}</div>` : ''}</div></div>`;
            html += '</div></div></div>';
            return html;
        }

        function orderInfoFieldFullWidth(key, value) {
            const k = (key || '').replace(/:$/, '').trim().toLowerCase();
            if (k === 'name' || k === 'address') return false;
            if ((value || '').includes('\n')) return true;
            return /address|notes|comments|instructions|details/i.test(key);
        }

        function groupOrderInfoAttributes(attributes) {
            const sections = [];
            let current = null;
            attributes.forEach(attr => {
                const key = (attr.key || '').trim();
                const value = attr.value || '';
                const isHeading = key && !key.endsWith(':') && key === key.toUpperCase() && /[A-Z]/.test(key);
                if (isHeading) {
                    current = { heading: key, heading_value: value, fields: [] };
                    sections.push(current);
                    return;
                }
                if (!current) {
                    current = { heading: null, heading_value: '', fields: [] };
                    sections.push(current);
                }
                current.fields.push({
                    key,
                    value,
                    full_width: orderInfoFieldFullWidth(key, value),
                });
            });
            return sections;
        }

        function orderInfoFieldLabel(f) {
            return f.display_label || f.key || '';
        }

        function fitOrderInfoAddressTextarea(ta) {
            if (!ta) return;
            const hidden = !ta.offsetParent && getComputedStyle(ta).display !== 'fixed';
            if (hidden) {
                ta.dataset.addressPendingFit = '1';
                return;
            }
            ta.style.height = '0px';
            const minH = parseFloat(getComputedStyle(ta).minHeight) || 0;
            ta.style.height = Math.max(ta.scrollHeight, minH) + 'px';
            ta.dataset.addressPendingFit = '0';
        }

        function initOrderInfoAddressAutoHeight(root) {
            (root || document).querySelectorAll('textarea[data-field-role="address"]').forEach(ta => {
                fitOrderInfoAddressTextarea(ta);
                if (ta.dataset.addressAutoHeight) return;
                ta.dataset.addressAutoHeight = '1';
                ta.addEventListener('input', () => fitOrderInfoAddressTextarea(ta));
            });
        }

        function scheduleAddressTextareaFit(root) {
            const el = root || document;
            const run = () => initOrderInfoAddressAutoHeight(el);
            run();
            requestAnimationFrame(() => {
                run();
                requestAnimationFrame(run);
            });
        }

        function renderOrderInfoField(f, inputClass, keyAttr, hideLabel) {
            const fw = f.full_width ? ' full-width' : '';
            const rows = f.full_width && f.field_role !== 'address' ? 3 : 1;
            const restore = f.restore_heading ? ` data-restore-heading="${escapeHtml(f.restore_heading)}"` : '';
            const role = f.field_role ? ` data-field-role="${escapeHtml(f.field_role)}"` : '';
            const addr = f.field_role === 'address' ? ' order-info-field--address' : '';
            const label = orderInfoFieldLabel(f);
            return `<div class="order-info-field${fw}${addr}">
                ${hideLabel ? '' : `<label title="${escapeHtml(label)}">${escapeHtml(label)}</label>`}
                <textarea class="${inputClass}" ${keyAttr}="${escapeHtml(f.key)}" rows="${rows}"${restore}${role}>${escapeHtml(f.value || '')}</textarea>
            </div>`;
        }

        function isAdditionalNotesHeading(heading) {
            return (heading || '').replace(/:$/, '').trim().toLowerCase() === 'additional notes';
        }

        // The customer's "dispatch ASAP / collect early if ready sooner" choice,
        // shown as one line under each product's requested date.
        const ASAP_HEADINGS = ['DISPATCH ASAP IF READY SOONER', 'EARLY COLLECTION IF READY SOONER'];
        function noteHeadingNorm(h) { return (h || '').trim().replace(/:$/, '').trim().toUpperCase(); }
        function isAsapHeading(h) { return ASAP_HEADINGS.includes(noteHeadingNorm(h)); }

        // Returns the line to show under one date: a Yes/No switch when the note has
        // an ASAP line for that product (switching it edits the hidden ASAP field,
        // saved with "Save order info"), else plain text from the storefront data.
        function asapControlFor(o, field) {
            if (!field || field.field_role === 'po') return '';
            const pickup = (o.dispatch_method || '') === 'pickup'
                || /COLLECTION/i.test(field.restore_heading || '');
            const label = pickup ? 'Early collection if ready sooner' : 'Dispatch ASAP if ready sooner';
            const key = noteHeadingNorm(field.key);
            for (const sec of (o.order_info && o.order_info.note_sections) || []) {
                if (!isAsapHeading(sec.heading)) continue;
                const hit = (sec.fields || []).find(f => noteHeadingNorm(f.key) === key);
                if (!hit) continue;
                const v = String(hit.value || '').trim().toLowerCase();
                const opt = (val, text) => `<option value="${val}"${v === val.toLowerCase() ? ' selected' : ''}>${text}</option>`;
                return `<div class="order-info-asap">${escapeHtml(label)}:
                    <select class="order-info-asap-select" data-asap-key="${escapeHtml(hit.key)}" onchange="setAsapNoteField(this)">
                        ${v === 'yes' || v === 'no' ? '' : '<option value="" selected>—</option>'}${opt('Yes', 'Yes')}${opt('No', 'No')}
                    </select></div>`;
            }
            // No ASAP line in the note: show the storefront's answer, if any.
            const line = (o.order_items || []).find(li => li.sku && key.includes('(' + String(li.sku).toUpperCase() + ')'));
            if (line && typeof line.asap_if_ready_sooner === 'boolean') {
                return `<div class="order-info-asap">${escapeHtml(label)}: ${line.asap_if_ready_sooner ? 'Yes' : 'No'}</div>`;
            }
            return '';
        }

        function setAsapNoteField(select) {
            const form = select.closest('form');
            if (!form) return;
            const key = select.dataset.asapKey;
            form.querySelectorAll('.order-info-note-group[hidden] .order-info-note-field').forEach(el => {
                if (el.dataset.noteKey === key) el.value = select.value;
            });
        }

        function renderDateTopRow(sec, inputClass, keyAttr, o) {
            const fields = sec.fields || [];
            const cols = sec.field_count || fields.length || 1;
            let html = `<div class="order-info-group order-info-note-group" data-layout="date-top-row"><h5 class="order-info-group-title is-blank" aria-hidden="true">&nbsp;</h5><div class="order-info-top-dates" style="--top-date-cols: ${cols}">`;
            fields.forEach(f => {
                const restore = f.restore_heading ? ` data-restore-heading="${escapeHtml(f.restore_heading)}"` : '';
                const role = f.field_role ? ` data-field-role="${escapeHtml(f.field_role)}"` : '';
                const label = orderInfoFieldLabel(f);
                html += `<div class="order-info-field">
                    <label title="${escapeHtml(label)}">${escapeHtml(label)}</label>
                    <textarea class="${inputClass}" ${keyAttr}="${escapeHtml(f.key)}" rows="1"${restore}${role}>${escapeHtml(f.value || '')}</textarea>
                    ${asapControlFor(o || {}, f)}
                </div>`;
            });
            html += '</div></div>';
            return html;
        }

        function collectNoteSectionsFromForm(form) {
            const sections = [];
            form.querySelectorAll('.order-info-note-group').forEach(group => {
                if (group.dataset.layout === 'date-top-row') {
                    const fields = [];
                    group.querySelectorAll('.order-info-note-field').forEach(el => {
                        fields.push({
                            key: el.dataset.noteKey,
                            value: el.value,
                            restore_heading: el.dataset.restoreHeading || null,
                            field_role: el.dataset.fieldRole || null,
                        });
                    });
                    sections.push({ layout: 'date_top_row', heading: null, fields, field_count: fields.length });
                    return;
                }
                const heading = group.dataset.heading || null;
                const fields = [];
                group.querySelectorAll('.order-info-note-field').forEach(el => {
                    fields.push({ key: el.dataset.noteKey, value: el.value });
                });
                sections.push({ heading, fields });
            });
            return sections;
        }

        function renderOrderInfoSection(o, apiPrefix = '/api/orders') {
            const info = o.order_info || { note: '', note_sections: [], attributes: [], sections: [] };
            const noteSections = (info.note_sections && info.note_sections.length)
                ? info.note_sections
                : null;
            const attrSections = (info.sections && info.sections.length)
                ? info.sections
                : groupOrderInfoAttributes(info.attributes || []);
            let html = `<div class="detail-section order-info-section"><h4>Order info</h4>
                <form class="order-info-form" data-order-id="${escapeHtml(o.id)}" data-api-prefix="${apiPrefix}">
                <div class="order-info-panel">`;
            if (noteSections) {
                noteSections.forEach(sec => {
                    if (sec.layout === 'date_top_row') {
                        html += renderDateTopRow(sec, 'order-info-note-field', 'data-note-key', o);
                        return;
                    }
                    const headingAttr = sec.heading ? ` data-heading="${escapeHtml(sec.heading)}"` : '';
                    const sepClass = sec.separator_before ? ' has-separator' : '';
                    const hideFieldLabel = isAdditionalNotesHeading(sec.heading) && (sec.fields || []).length === 1;
                    const hiddenAttr = isAsapHeading(sec.heading) ? ' hidden' : '';
                    const wideClass = (sec.fields || []).some(f => f.full_width) ? ' order-info-group--wide' : '';
                    html += `<div class="order-info-group order-info-note-group${sepClass}${wideClass}"${headingAttr}${hiddenAttr}>`;
                    html += sec.heading ? `<h5 class="order-info-group-title">${escapeHtml(sec.heading)}</h5>` : '<h5 class="order-info-group-title is-blank" aria-hidden="true">&nbsp;</h5>';
                    html += '<div class="order-info-grid">';
                    (sec.fields || []).forEach(f => { html += renderOrderInfoField(f, 'order-info-note-field', 'data-note-key', hideFieldLabel); });
                    html += '</div></div>';
                });
            } else {
                html += `<div class="order-info-grid"><div class="order-info-field full-width">
                    <label>Notes</label>
                    <textarea class="order-info-note-raw" name="note" rows="8">${escapeHtml(info.note || '')}</textarea>
                </div></div>`;
            }
            if (attrSections.length) {
                attrSections.forEach(sec => {
                    html += '<div class="order-info-group order-info-attr-group">';
                    if (sec.heading) {
                        html += `<h5 class="order-info-group-title">${escapeHtml(sec.heading)}</h5>`;
                        html += `<input type="hidden" class="order-info-attr-input" data-attr-key="${escapeHtml(sec.heading)}" value="${escapeHtml(sec.heading_value || '')}">`;
                    } else {
                        html += '<h5 class="order-info-group-title is-blank" aria-hidden="true">&nbsp;</h5>';
                    }
                    html += '<div class="order-info-grid">';
                    (sec.fields || []).forEach(f => { html += renderOrderInfoField(f, 'order-info-attr-input', 'data-attr-key'); });
                    html += '</div></div>';
                });
            }
            // Attributes the storefront writes for Biteboard (e.g. _dispatch_schedule):
            // not shown, but saved back unchanged so Shopify keeps them.
            (info.hidden_attributes || []).forEach(a => {
                html += `<input type="hidden" class="order-info-attr-input" data-attr-key="${escapeHtml(a.key)}" value="${escapeHtml(a.value || '')}">`;
            });
            html += `</div><div class="order-info-actions">
                    <button type="submit" class="btn-save-order-info">Save order info</button>
                    <span class="order-info-msg" hidden></span>
                    ${renderOrderDangerActions(o)}
                </div></form></div>`;
            return html;
        }

        function renderOrderDetails(o) {
            let html = '<div class="details-inner">';

            html += renderLineSection('Items', o.order_items || [], 'No items', o.id);
            html += renderFeesSection(o.fees, o.id);
            html += renderOrderCostSections(o);
            html += renderOrderAddressesSection(o);
            html += renderOrderInfoSection(o);
            html += '</div>';
            return html;
        }

        // ---- Cancel order (bottom of the dropdown) ----
        function renderOrderDangerActions(o) {
            const id = escapeHtml(o.id), name = escapeHtml(o.name);
            let html = '<div class="order-danger-actions">';
            if (o.cancelled_at) {
                html += `<span class="order-cancelled-note"><i class="fas fa-ban"></i> Cancelled ${escapeHtml(formatDate(o.cancelled_at))}</span>`;
            } else {
                html += `<button type="button" class="btn-ghost order-cancel-btn" data-order-id="${id}" data-order-name="${name}"><i class="fas fa-ban"></i> Cancel order</button>`;
            }
            return html + '</div>';
        }

        const CANCEL_REASONS = [
            ['CUSTOMER', 'Customer changed or cancelled their order'],
            ['STAFF', 'Staff error'],
            ['INVENTORY', 'Items unavailable'],
            ['DECLINED', 'Payment declined'],
            ['FRAUD', 'Fraudulent order'],
            ['OTHER', 'Other'],
        ];

        function ensureCancelModal() {
            let modal = document.getElementById('order-cancel-modal');
            if (modal) return modal;
            modal = document.createElement('div');
            modal.id = 'order-cancel-modal';
            modal.className = 'office-changes-modal order-cancel-modal';
            modal.hidden = true;
            modal.innerHTML = `
                <div class="office-changes-modal-backdrop" data-close-cancel></div>
                <form class="office-changes-modal-panel order-cancel-panel" role="dialog" aria-modal="true" aria-labelledby="order-cancel-title">
                    <button type="button" class="office-changes-modal-close" data-close-cancel aria-label="Close">&times;</button>
                    <h3 id="order-cancel-title">Cancel order</h3>
                    <p class="order-cancel-lead">This cancels the order in Shopify and can't be undone.</p>
                    <label class="order-cancel-field">Reason
                        <select name="reason">${CANCEL_REASONS.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>
                    </label>
                    <label class="order-cancel-check"><input type="checkbox" name="restock" checked> Restock the items</label>
                    <label class="order-cancel-check"><input type="checkbox" name="refund"> Refund the customer to their original payment method</label>
                    <label class="order-cancel-check"><input type="checkbox" name="notify_customer"> Email the customer that it's cancelled</label>
                    <label class="order-cancel-field">Note for staff (optional)
                        <input type="text" name="staff_note" maxlength="200" placeholder="Why it was cancelled">
                    </label>
                    <div class="order-cancel-msg" hidden></div>
                    <div class="order-cancel-buttons">
                        <button type="button" class="btn-ghost" data-close-cancel>Keep order</button>
                        <button type="submit" class="order-cancel-confirm"><i class="fas fa-ban"></i> Cancel order</button>
                    </div>
                </form>`;
            document.body.appendChild(modal);
            modal.addEventListener('click', e => { if (e.target.closest('[data-close-cancel]')) modal.hidden = true; });
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) modal.hidden = true; });
            modal.querySelector('form').addEventListener('submit', submitCancelOrder);
            return modal;
        }

        function openCancelOrder(orderId, orderName) {
            const modal = ensureCancelModal();
            const form = modal.querySelector('form');
            form.reset();
            form.dataset.orderId = orderId;
            form.dataset.orderName = orderName || '';
            modal.querySelector('#order-cancel-title').textContent = `Cancel order ${orderName || ''}`;
            const msg = form.querySelector('.order-cancel-msg');
            msg.hidden = true;
            const btn = form.querySelector('.order-cancel-confirm');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-ban"></i> Cancel order';
            modal.hidden = false;
        }

        async function submitCancelOrder(e) {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('.order-cancel-confirm');
            const msg = form.querySelector('.order-cancel-msg');
            const orderId = form.dataset.orderId;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cancelling…';
            msg.hidden = true;
            try {
                const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}/cancel`, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reason: form.reason.value,
                        restock: form.restock.checked,
                        refund: form.refund.checked,
                        notify_customer: form.notify_customer.checked,
                        staff_note: form.staff_note.value,
                    }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.success) throw new Error(data.error || 'Could not cancel the order');
                const order = allOrders.find(o => String(o.id) === String(orderId));
                if (order) order.cancelled_at = data.cancelled_at || new Date().toISOString();
                document.getElementById('order-cancel-modal').hidden = true;
                renderOrdersView(filterOrders(document.getElementById('search-input').value));
                if (data.pending) alert(`Shopify is still finishing cancelling ${data.order || 'the order'} - refresh in a minute to check.`);
            } catch (err) {
                msg.textContent = err.message;
                msg.hidden = false;
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-ban"></i> Cancel order';
            }
        }

        async function saveOrderInfoForm(form) {
            const orderId = form.dataset.orderId;
            const prefix = form.dataset.apiPrefix || '/api/orders';
            const btn = form.querySelector('.btn-save-order-info');
            const msg = form.querySelector('.order-info-msg');
            const noteGroups = form.querySelectorAll('.order-info-note-group');
            const rawNote = form.querySelector('.order-info-note-raw');
            const attributes = [];
            form.querySelectorAll('.order-info-attr-input').forEach(el => {
                attributes.push({ key: el.dataset.attrKey, value: el.value });
            });
            const payload = { attributes };
            if (noteGroups.length) {
                payload.note_sections = collectNoteSectionsFromForm(form);
            } else {
                payload.note = rawNote?.value ?? '';
            }
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Saving…';
            }
            if (msg) msg.hidden = true;
            try {
                const res = await fetch(`${prefix}/${encodeURIComponent(orderId)}/order-info`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(payload),
                });
                const data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.error || 'Save failed');
                if (msg) {
                    msg.textContent = 'Order info saved.';
                    msg.className = 'order-info-msg ok';
                    msg.hidden = false;
                }
            } catch (err) {
                if (msg) {
                    msg.textContent = err.message || 'Could not save order info.';
                    msg.className = 'order-info-msg err';
                    msg.hidden = false;
                }
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = 'Save order info';
                }
            }
        }

        function getOrderIndicator(orderId) {
            const id = String(orderId);
            if (Object.prototype.hasOwnProperty.call(orderIndicators, id)) {
                return orderIndicators[id];
            }
            if (window.OfficeTracking && typeof OfficeTracking.getCachedOrderIndicator === 'function') {
                const cached = OfficeTracking.getCachedOrderIndicator(id);
                if (cached !== null) return cached;
            }
            return 'none';
        }

        function isOrderCompleted(orderId) {
            const id = String(orderId);
            if (!Object.prototype.hasOwnProperty.call(orderIndicators, id)) return false;
            return window.OfficeTracking && typeof OfficeTracking.isCompletedIndicator === 'function'
                && OfficeTracking.isCompletedIndicator(orderIndicators[id]);
        }

        function indicatorPriority(orderId) {
            if (window.OfficeTracking && typeof OfficeTracking.indicatorSortPriority === 'function') {
                return OfficeTracking.indicatorSortPriority(getOrderIndicator(orderId));
            }
            return 99;
        }

        function partitionOrders(orders) {
            const active = [];
            const completed = [];
            orders.forEach(o => {
                if (o.cancelled_at || isOrderCompleted(o.id)) completed.push(o);
                else active.push(o);
            });
            return { active, completed };
        }

        function sortActiveOrders(orders) {
            const copy = [...orders];
            if (sortMode === 'recent') {
                copy.sort((a, b) => (b.processed_at || '').localeCompare(a.processed_at || ''));
                return copy;
            }
            copy.sort((a, b) => {
                const diff = indicatorPriority(a.id) - indicatorPriority(b.id);
                if (diff !== 0) return diff;
                return (b.processed_at || '').localeCompare(a.processed_at || '');
            });
            return copy;
        }

        function sortCompletedOrders(orders) {
            return [...orders].sort((a, b) => (b.processed_at || '').localeCompare(a.processed_at || ''));
        }

        function renderOrderTableHtml(orders) {
            if (!orders.length) {
                return '<div class="state-msg">No orders found.</div>';
            }
            let html = '<div class="list-card-scroll"><table><thead><tr><th>Order</th><th class="order-status-indicator-cell" aria-hidden="true"></th><th>Date</th><th>Company</th><th>Customer</th><th>Email</th><th>Landline</th><th>Mobile</th><th>Dispatch</th><th class="order-col-total">Total</th></tr></thead><tbody>';
            orders.forEach(o => {
                const orderId = String(o.id);
                const indicator = getOrderIndicator(orderId);
                const indicatorHtml = (window.OfficeTracking && typeof OfficeTracking.renderOrderIndicatorHtml === 'function')
                    ? OfficeTracking.renderOrderIndicatorHtml(indicator)
                    : '';
                html += `<tr class="data-row" data-order-id="${escapeHtml(orderId)}">
                    <td><strong>${escapeHtml(o.name)}</strong>${o.cancelled_at ? '<span class="order-cancelled-pill">Cancelled</span>' : ''}<i class="fas fa-chevron-down order-chevron"></i></td>
                    <td class="order-status-indicator-cell"><span class="order-status-indicator-slot" data-order-id="${escapeHtml(orderId)}">${indicatorHtml}</span></td>
                    <td class="order-col-date">${escapeHtml(formatDate(o.processed_at))}</td>
                    <td>${escapeHtml(o.company || '—')}</td>
                    <td>${escapeHtml(o.customer_name || '—')}</td>
                    <td class="order-col-email">${escapeHtml(o.customer_email || '—').replace(/@/g, '@<wbr>').replace(/\./g, '<wbr>.')}</td>
                    <td>${escapeHtml(o.landline_phone || '—')}</td>
                    <td>${escapeHtml(o.mobile_number || '—')}</td>
                    <td>${escapeHtml(o.dispatch_display || '—')}</td>
                    <td class="order-col-total">${escapeHtml(o.total_display || formatGbp(o.total))}</td>
                </tr>
                <tr class="details-row" id="details-${escapeHtml(orderId)}"><td colspan="10">${renderOrderDetails(o)}</td></tr>`;
            });
            html += '</tbody></table></div>';
            return html;
        }

        function bindOrderRows(container) {
            if (!container) return;
            container.querySelectorAll('.data-row').forEach(row => {
                row.addEventListener('click', () => {
                    const orderId = row.dataset.orderId;
                    const dr = document.getElementById('details-' + orderId);
                    if (dr) {
                        const isOpen = dr.classList.toggle('open');
                        row.classList.toggle('expanded', isOpen);
                        if (isOpen && orderId && window.OfficeTracking) {
                            const inner = dr.querySelector('.details-inner') || dr;
                            OfficeTracking.loadOrderTracking(orderId, '/api/orders', inner, 'staff');
                        }
                        if (isOpen) {
                            scheduleAddressTextareaFit(dr);
                        } else if (ordersRefreshDeferred && !anyOrderOpen()) {
                            scheduleOrdersRefresh(true);  // catch up on the re-sort we held back
                        }
                    }
                });
            });
        }

        function captureScrollAnchor() {
            const rows = [...document.querySelectorAll('#content .data-row')];
            const anchor = rows.find(r => r.classList.contains('expanded'))
                || rows.find(r => r.getBoundingClientRect().bottom > 0);
            return anchor
                ? { id: anchor.dataset.orderId, top: anchor.getBoundingClientRect().top, y: window.scrollY }
                : { id: null, top: 0, y: window.scrollY };
        }

        function restoreScrollAnchor(a) {
            if (!a) return;
            const row = a.id && document.querySelector('#content .data-row[data-order-id="' + CSS.escape(a.id) + '"]');
            if (row) window.scrollBy(0, row.getBoundingClientRect().top - a.top);
            else window.scrollTo(0, a.y);
        }

        function renderOrdersView(orders) {
            const scrollAnchor = captureScrollAnchor();
            const content = document.getElementById('content');
            const pill = document.getElementById('count-pill');
            const expandedIds = new Set();
            document.querySelectorAll('.details-row.open').forEach(row => {
                const id = row.id.replace(/^details-/, '');
                if (id) expandedIds.add(id);
            });
            const { active, completed } = partitionOrders(orders);
            const activeSorted = sortActiveOrders(active);
            const completedSorted = sortCompletedOrders(completed);
            const activeLabel = activeSorted.length + ' active';
            const completedLabel = completedSorted.length + ' completed';
            pill.textContent = orders.length
                ? `${orders.length} order${orders.length === 1 ? '' : 's'} · ${activeLabel} · ${completedLabel}`
                : '0 orders';

            if (!orders.length) {
                content.innerHTML = '<div class="list-card"><div class="state-msg">No orders found.</div></div>';
                return;
            }

            let html = '<div class="orders-stack">';
            const activeBody = activeSorted.length
                ? renderOrderTableHtml(activeSorted)
                : '<div class="state-msg">No active orders.</div>';
            html += `<div class="orders-section orders-active-section"><div class="list-card">${activeBody}</div></div>`;
            if (completedSorted.length) {
                html += `<div class="orders-section orders-completed-section">
                    <h2 class="orders-section-heading"><i class="fas fa-circle-check"></i> Completed Orders <span class="section-count">(${completedSorted.length})</span></h2>
                    <div class="list-card">${renderOrderTableHtml(completedSorted)}</div>
                </div>`;
            }
            html += '</div>';
            content.innerHTML = html;
            bindOrderRows(content);
            scheduleAddressTextareaFit(content);
            if (window.OfficeTracking && typeof OfficeTracking.applyCachedTrackingIn === 'function') {
                OfficeTracking.applyCachedTrackingIn(content, '/api/orders', 'staff');
            }
            expandedIds.forEach(orderId => {
                const dr = document.getElementById('details-' + orderId);
                const dataRow = content.querySelector('.data-row[data-order-id="' + CSS.escape(orderId) + '"]');
                if (dr && dataRow) {
                    dr.classList.add('open');
                    dataRow.classList.add('expanded');
                }
            });
            if (expandedIds.size) {
                requestAnimationFrame(() => {
                    expandedIds.forEach(orderId => {
                        const dr = document.getElementById('details-' + orderId);
                        if (dr) scheduleAddressTextareaFit(dr);
                    });
                });
            }
            restoreScrollAnchor(scrollAnchor);
            requestAnimationFrame(() => requestAnimationFrame(() => restoreScrollAnchor(scrollAnchor)));
        }

        let ordersRefreshDeferred = false;

        function anyOrderOpen() {
            return !!document.querySelector('#content .details-row.open');
        }

        function scheduleOrdersRefresh(immediate) {
            clearTimeout(ordersRefreshTimer);
            const run = () => {
                // Don't redraw under someone who has an order open - it would reset
                // what they're typing and jump the page. Catch up when it's closed.
                if (anyOrderOpen()) {
                    ordersRefreshDeferred = true;
                    return;
                }
                ordersRefreshDeferred = false;
                renderOrdersView(filterOrders(document.getElementById('search-input').value));
            };
            if (immediate) {
                run();
                return;
            }
            ordersRefreshTimer = setTimeout(run, 450);
        }

        function onTrackingSettled(orderId, entry, immediate) {
            const id = String(orderId);
            const prev = orderIndicators[id];
            let indicator = 'none';
            if (entry && entry.status === 'done') {
                indicator = OfficeTracking.computeOrderIndicator(entry.data.items);
            }
            orderIndicators[id] = indicator;
            if (entry && entry.status === 'done') {
                freshIndicatorIds.add(id);
                saveStoredIndicators();
            }
            if (window.OfficeTracking && typeof OfficeTracking.updateOrderRowIndicator === 'function') {
                OfficeTracking.updateOrderRowIndicator(id, indicator);
            }
            const prevCompleted = prev === 'green';
            const nowCompleted = indicator === 'green';
            if (suppressOrdersRefresh) return;
            if (prevCompleted !== nowCompleted || sortMode === 'priority') {
                scheduleOrdersRefresh(!!immediate);
            }
        }

        let trackingPrefetchToken = 0;
        // Filled by the progress batch on page load (like order tracking), so
        // "View change history" opens straight away.
        let orderHistoryCache = {};
        const INDICATOR_STORE_KEY = 'bb_order_indicators_v1';
        const freshIndicatorIds = new Set();   // refreshed from the server this visit

        // Last known progress per order, kept in the browser so completed orders
        // can be filtered away the moment the tab opens, then quietly refreshed.
        function loadStoredIndicators() {
            try { return JSON.parse(localStorage.getItem(INDICATOR_STORE_KEY) || '{}') || {}; }
            catch (_) { return {}; }
        }
        function saveStoredIndicators() {
            try {
                const keep = {};
                allOrders.forEach(o => {
                    const id = String(o.id);
                    if (Object.prototype.hasOwnProperty.call(orderIndicators, id)) keep[id] = orderIndicators[id];
                });
                localStorage.setItem(INDICATOR_STORE_KEY, JSON.stringify(keep));
            } catch (_) { /* storage full or blocked - fine */ }
        }

        async function prefetchTrackingForOrders(orders) {
            if (!window.OfficeTracking || typeof OfficeTracking.computeOrderIndicator !== 'function') return;
            const token = ++trackingPrefetchToken;
            const todo = (orders || []).filter(o => o.id && !freshIndicatorIds.has(String(o.id)));
            if (!todo.length) return;
            const chunks = [];
            for (let i = 0; i < todo.length; i += 40) chunks.push(todo.slice(i, i + 40));

            async function runChunk(chunk) {
                const body = {
                    full: true,  // whole tracking too, so opening an order is instant
                    orders: chunk.map(o => ({
                        id: String(o.id),
                        name: o.name,
                        customer_id: o.customer_id || '',
                        customer_name: o.customer_name || '',
                        customer_email: o.customer_email || '',
                        processed_at: o.processed_at || '',  // new orders get tracking set up automatically
                        lines: (o.order_items || []).map(li => ({
                            line_number: li.line_number, title: li.title, office_item_id: li.office_item_id || null,
                        })),
                    })),
                };
                try {
                    const res = await fetch('/api/orders/indicators', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body),
                    });
                    const data = await res.json();
                    if (token !== trackingPrefetchToken || !data.success) return;
                    if (typeof OfficeTracking.primeOrderTracking === 'function') {
                        Object.entries(data.tracking || {}).forEach(([id, payload]) => {
                            OfficeTracking.primeOrderTracking(id, payload, '/api/orders', 'staff');
                        });
                    }
                    Object.entries(data.history || {}).forEach(([id, h]) => { orderHistoryCache[id] = h; });
                    let changed = false;
                    Object.entries(data.results || {}).forEach(([id, items]) => {
                        freshIndicatorIds.add(id);
                        const indicator = OfficeTracking.computeOrderIndicator(items);
                        const prev = orderIndicators[id];
                        orderIndicators[id] = indicator;
                        if (typeof OfficeTracking.updateOrderRowIndicator === 'function') {
                            OfficeTracking.updateOrderRowIndicator(id, indicator);
                        }
                        if ((prev === 'green') !== (indicator === 'green') || (sortMode === 'priority' && prev !== indicator)) {
                            changed = true;
                        }
                    });
                    saveStoredIndicators();
                    if (changed) scheduleOrdersRefresh(false);
                } catch (err) {
                    console.warn('Progress batch failed:', err);
                }
            }

            // A few batches in flight at once; each one updates the list as it lands.
            const queue = chunks.slice();
            const workers = Array.from({ length: Math.min(3, queue.length) }, async () => {
                while (queue.length && token === trackingPrefetchToken) await runChunk(queue.shift());
            });
            await Promise.all(workers);
        }

        function startBackgroundTrackingPrefetch(orders) {
            void prefetchTrackingForOrders(orders);
        }

        function filterOrders(q) {
            const term = (q || '').trim().toLowerCase();
            if (!term) return allOrders;
            return allOrders.filter(o =>
                (o.name || '').toLowerCase().includes(term) ||
                (o.company || '').toLowerCase().includes(term) ||
                (o.customer_name || '').toLowerCase().includes(term) ||
                (o.customer_email || '').toLowerCase().includes(term) ||
                (o.landline_phone || '').toLowerCase().includes(term) ||
                (o.mobile_number || '').toLowerCase().includes(term)
            );
        }

        async function loadOrders(forceRefresh) {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="list-card"><div class="state-msg"><i class="fas fa-spinner fa-spin"></i> Loading orders…</div></div>';
            suppressOrdersRefresh = true;
            try {
                const res = await fetch('/api/orders', { credentials: 'same-origin' });
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'Failed to load orders');
                allOrders = data.orders || [];
                // Start from the last known progress so completed orders hide straight away.
                orderIndicators = forceRefresh ? {} : loadStoredIndicators();
                freshIndicatorIds.clear();
                if (window.OfficeTracking && typeof OfficeTracking.clearOrderTrackingCache === 'function') {
                    OfficeTracking.clearOrderTrackingCache();
                }
                orderHistoryCache = {};
                const filtered = filterOrders(document.getElementById('search-input').value);
                renderOrdersView(filtered);
                void prefetchTrackingForOrders(filtered);
            } catch (err) {
                content.innerHTML = `<div class="list-card"><div class="state-msg error">${escapeHtml(err.message)}</div></div>`;
                document.getElementById('count-pill').textContent = '0 orders';
            } finally {
                suppressOrdersRefresh = false;
            }
        }

        document.getElementById('content').addEventListener('submit', function(e) {
            const chargeForm = e.target.closest('.add-charge-form');
            if (chargeForm) { e.preventDefault(); e.stopPropagation(); submitAddCharge(chargeForm); return; }
            const form = e.target.closest('.order-info-form');
            if (!form) return;
            e.preventDefault();
            e.stopPropagation();
            saveOrderInfoForm(form);
        });
        document.getElementById('content').addEventListener('change', function(e) {
            const sel = e.target.closest('.print-select');
            if (!sel || !sel.value) return;
            const kind = sel.value;
            sel.value = '';  // back to "Choose…" so the same sheet can be printed again
            if (kind === 'production') printProductionNote(sel.dataset.orderId, sel.dataset.lineNumber);
            else if (kind === 'artwork') printArtJobSheet(sel.dataset.orderId, sel.dataset.lineNumber);
            else if (kind === 'sage') printSageInfo(sel.dataset.orderId);
        });
        // ---- Change history: who changed what on this order, and when ----
        function historyWhen(iso) {
            const d = new Date(iso);
            if (isNaN(d)) return iso || '';
            return d.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function ensureHistoryModal() {
            let modal = document.getElementById('order-history-modal');
            if (modal) return modal;
            modal = document.createElement('div');
            modal.id = 'order-history-modal';
            modal.className = 'office-changes-modal order-history-modal';
            modal.hidden = true;
            modal.innerHTML = `
                <div class="office-changes-modal-backdrop" data-close-history></div>
                <div class="office-changes-modal-panel order-history-panel" role="dialog" aria-modal="true" aria-labelledby="order-history-title">
                    <button type="button" class="office-changes-modal-close" data-close-history aria-label="Close">&times;</button>
                    <h3 id="order-history-title">Change history</h3>
                    <div class="order-history-body"></div>
                </div>`;
            document.body.appendChild(modal);
            modal.addEventListener('click', e => {
                if (e.target.closest('[data-close-history]')) modal.hidden = true;
            });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && !modal.hidden) modal.hidden = true;
            });
            return modal;
        }

        function renderOrderHistoryHtml(data) {
            const items = data.items || {};
            let html = '<ol class="order-history-list">';
            (data.events || []).forEach(ev => {
                const product = ev.item ? (items[ev.item] || ev.item) : '';
                html += `<li class="order-history-event">
                    <div class="order-history-meta">${escapeHtml(historyWhen(ev.at))} · ${escapeHtml(ev.who || '')}</div>
                    <div class="order-history-action">${escapeHtml(ev.action || '')}${product ? ` <span class="order-history-item">${escapeHtml(product)}</span>` : ''}</div>
                    ${ev.detail ? `<div class="order-history-detail">${escapeHtml(ev.detail)}</div>` : ''}
                </li>`;
            });
            if (data.placed_at) {
                html += `<li class="order-history-event">
                    <div class="order-history-meta">${escapeHtml(historyWhen(data.placed_at))} · Shopify</div>
                    <div class="order-history-action">Order placed</div>
                </li>`;
            }
            html += '</ol>';
            if (!(data.events || []).length) {
                html = '<p class="order-history-empty">No changes recorded yet. Changes made in BiteBoard from now on will show here.</p>' + html;
            }
            return html;
        }

        async function openOrderHistory(orderId, orderName) {
            const modal = ensureHistoryModal();
            const body = modal.querySelector('.order-history-body');
            modal.querySelector('#order-history-title').textContent = `Change history — ${orderName || ''}`;
            const id = String(orderId);
            const cached = orderHistoryCache[id];
            let shown = '';
            if (cached) {
                shown = renderOrderHistoryHtml(cached);
                body.innerHTML = shown;
            } else {
                body.innerHTML = '<p class="order-history-empty"><i class="fas fa-spinner fa-spin"></i> Loading…</p>';
            }
            body.dataset.orderId = id;
            modal.hidden = false;
            // Check for anything newer (changes made since the page loaded).
            try {
                const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}/history`, { credentials: 'same-origin' });
                const data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.error || 'Could not load the history');
                orderHistoryCache[id] = data;
                const html = renderOrderHistoryHtml(data);
                if (body.dataset.orderId === id && !modal.hidden && html !== shown) body.innerHTML = html;
            } catch (err) {
                if (!cached && body.dataset.orderId === id) {
                    body.innerHTML = `<p class="order-history-empty">${escapeHtml(err.message)}</p>`;
                }
            }
        }

        document.getElementById('content').addEventListener('click', function(e) {
            const cancelBtn = e.target.closest('.order-cancel-btn');
            if (cancelBtn) {
                e.preventDefault();
                e.stopPropagation();
                openCancelOrder(cancelBtn.dataset.orderId, cancelBtn.dataset.orderName);
                return;
            }
            const historyBtn = e.target.closest('.btn-order-history');
            if (historyBtn) {
                e.preventDefault();
                e.stopPropagation();
                openOrderHistory(historyBtn.dataset.orderId, historyBtn.dataset.orderName);
                return;
            }
            const addCharge = e.target.closest('.btn-add-charge, .btn-add-charge-cancel');
            if (addCharge) {
                const box = addCharge.closest('.add-charge');
                const form = box.querySelector('.add-charge-form');
                const opening = addCharge.classList.contains('btn-add-charge');
                form.hidden = !opening;
                box.querySelector('.btn-add-charge').hidden = opening;
                if (opening) {
                    form.querySelector('.add-charge-msg').hidden = true;
                    form.elements.title.focus();
                }
                return;
            }
            const artBtn = e.target.closest('.btn-print-art-job-sheet');
            if (artBtn) {
                e.preventDefault();
                printArtJobSheet(artBtn.dataset.orderId, artBtn.dataset.lineNumber);
                return;
            }
            const btn = e.target.closest('.btn-print-production-note');
            if (!btn) return;
            e.preventDefault();
            printProductionNote(btn.dataset.orderId, btn.dataset.lineNumber);
        });
        document.getElementById('search-input').addEventListener('input', function() {
            const filtered = filterOrders(this.value);
            renderOrdersView(filtered);
            startBackgroundTrackingPrefetch(filtered);
        });
        document.getElementById('sort-select').value = sortMode;
        document.getElementById('sort-select').addEventListener('change', function() {
            sortMode = this.value;
            localStorage.setItem(SORT_STORAGE_KEY, sortMode);
            renderOrdersView(filterOrders(document.getElementById('search-input').value));
        });
        document.getElementById('refresh-btn').addEventListener('click', function () { loadOrders(true); });
        document.addEventListener('office-order-tracking-changed', function(e) {
            const detail = e.detail || {};
            if (detail.role === 'client') return;
            onTrackingSettled(detail.orderId, {
                status: 'done',
                data: { items: detail.items || [] },
            }, !!detail.immediate);
        });
        // ?q=#S1099 (e.g. from the home dashboard) opens the list already searched.
        try {
            const preset = new URLSearchParams(window.location.search).get('q');
            if (preset) document.getElementById('search-input').value = preset;
        } catch (e) { /* ignore */ }
        loadOrders();
        window.addEventListener('load', () => scheduleAddressTextareaFit(document.getElementById('content')));
    </script>
    <script src="/static/production_note_print.js?v=3"></script>
    <script src="/static/office_tracking.js?v=47"></script>
</body>
