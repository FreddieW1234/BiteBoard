<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheduled maintenance</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f6f8fa;
        color: #1f2937;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }
    .panel {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        max-width: 520px;
        width: 100%;
        padding: 40px 36px;
        text-align: center;
    }
    h1 {
        font-size: 1.35rem;
        font-weight: 600;
        color: #111827;
        margin-bottom: 14px;
    }
    p {
        font-size: 0.95rem;
        line-height: 1.6;
        color: #4b5563;
    }
    .contact {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;
        font-size: 0.875rem;
        color: #6b7280;
    }
    a {
        color: #4f46e5;
        text-decoration: none;
    }
    a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>
    <div class="panel">
        <h1>Scheduled maintenance</h1>
        <p>The portal is temporarily unavailable while we carry out scheduled maintenance. Please try again shortly.</p>
        <p class="contact">
            If you need assistance, contact
            <!-- PLACEHOLDER: replace both the mailto address and the link text below -->
            <a href="mailto:REPLACE-ME@example.com">REPLACE-ME@example.com</a>
        </p>
    </div>
</body>
</html>
